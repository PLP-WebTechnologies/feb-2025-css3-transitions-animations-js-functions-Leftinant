<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Animations and Persistence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="animatedButton">Animate Me!</button>
    <img id="animatedImage" src="2.jpg" alt="Placeholder Image">
    <div id="preferencePanel">
        <h2>User Preferences</h2>
        <label for="animationSpeed">Animation Speed:</label>
        <input type="range" id="animationSpeed" min="0.1" max="2" step="0.1" value="1">
        <span id="speedValue">1x</span>
        <button id="resetPreferences">Reset Preferences</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
